name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Deploy preview
        id: deploy
        run: |
          PREVIEW_URL=$(vercel --token ${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | grep -oP 'https://[^\s]+\.vercel\.app' | head -1)
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Run Lighthouse
        uses: foo-software/lighthouse-check-action@v10
        with:
          urls: |
            ${{ steps.deploy.outputs.url }}
          thresholds: |
            seo: 80
            performance: 50
            accessibility: 70
            bestPractices: 70
          output: json
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./lighthouse-result.json', 'utf8'));
            const scores = results.map(r => `**${r.name}**: SEO ${r.score}/100, Perf ${r.scorePerformance}/100, A11y ${r.scoreAccessibility}/100`).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Lighthouse Results\n\n${scores}`
            });
