<style>
.hd-bar{position:fixed;top:0;left:0;right:0;z-index:50;border-bottom:1px solid rgba(255,255,255,0.1);background:rgba(6,6,6,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hd-wrap{max-width:1400px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
.hd-logo{font-family:Oswald,sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-0.025em;color:#F8FAFC;text-decoration:none}
.hd-logo span{color:#F97316}
.hd-desk{display:flex;align-items:center;gap:36px}
.hd-desk a{font-family:monospace,'Space Mono',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:0.2em;color:#94A3B8;text-decoration:none;transition:color .2s}
.hd-desk a:hover{color:#F97316}
.hd-cta{font-family:Oswald,sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.025em;color:#060606;background:#F97316;padding:10px 20px;text-decoration:none;transition:background .2s}
.hd-cta:hover{background:#fff}
.hd-burger{display:none;width:40px;height:40px;align-items:center;justify-content:center;color:#F8FAFC;background:none;border:none;padding:0;cursor:pointer}
.hd-menu{display:none;position:fixed;inset:0;z-index:40;background:rgba(6,6,6,0.98);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:96px 32px 32px}
.hd-menu.open{display:block}
.hd-menu nav{display:flex;flex-direction:column;gap:0}
.hd-menu a{font-family:Oswald,sans-serif;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;color:#F8FAFC;text-decoration:none;padding:18px 0;border-bottom:1px solid rgba(255,255,255,0.1);transition:color .2s}
.hd-menu a:hover{color:#F97316}
.hd-menu-cta{margin-top:24px;background:#F97316;color:#060606!important;text-align:center;border-bottom:none!important;padding:16px!important;font-size:18px}
.hd-menu-cta:hover{background:#fff}
@media(max-width:768px){
  .hd-desk{display:none!important}
  .hd-cta-desk{display:none!important}
  .hd-burger{display:flex}
}
</style>
<header class="hd-bar">
  <div class="hd-wrap">
    <a href="/" class="hd-logo">DECASTRO<span>.</span></a>
    <nav class="hd-desk">
      <a href="/#metodo">Metodo</a>
      <a href="/servizi.html">Servizi</a>
      <a href="/#storie">Storie</a>
      <a href="/blog/">Blog</a>
      <a href="/risorse/">Risorse</a>
      <a href="/chi-sono.html">Chi sono</a>
      <a href="/#faq">FAQ</a>
    </nav>
    <a href="/#contatti" class="hd-cta hd-cta-desk">Richiedi scheda</a>
    <button class="hd-burger" data-burger aria-label="Apri menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>
</header>
<div class="hd-menu" data-mobile-menu>
  <nav>
    <a href="/#metodo">Metodo</a>
    <a href="/servizi.html">Servizi</a>
    <a href="/#storie">Storie</a>
    <a href="/blog/">Blog</a>
    <a href="/risorse/">Risorse</a>
    <a href="/chi-sono.html">Chi sono</a>
    <a href="/#faq">FAQ</a>
    <a href="/#contatti" class="hd-menu-cta">Richiedi scheda</a>
  </nav>
</div>
<script>
(function(){var b=document.querySelector('[data-burger]');var m=document.querySelector('[data-mobile-menu]');if(!b||!m)return;function c(){m.classList.remove('open');document.body.style.overflow='';b.setAttribute('aria-label','Apri menu');}function o(){m.classList.add('open');document.body.style.overflow='hidden';b.setAttribute('aria-label','Chiudi menu');}function t(){m.classList.contains('open')?c():o();}b.addEventListener('click',t);m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',c)});})();
</script>
