<style>
/* Canonical header — 1:1 clone of homepage React nav (bundle fE) */
.hd-bar{position:fixed;top:0;left:0;right:0;z-index:50;background:transparent;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.hd-bar.scrolled{background:rgba(6,6,6,0.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom-color:rgba(255,255,255,0.1)}
.hd-wrap{max-width:1400px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between}
.hd-logo{font-family:Oswald,sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:-0.025em;color:#F8FAFC;text-decoration:none}
.hd-logo span{color:#F97316}
.hd-desk{display:flex;align-items:center;gap:36px}
.hd-desk a{font-family:'Space Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:0.2em;color:#94A3B8;text-decoration:none;transition:color .2s}
.hd-desk a:hover{color:#F97316}
.hd-cta{display:inline-flex;align-items:center;font-family:Oswald,sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.025em;color:#000;background:#F97316;padding:10px 20px;text-decoration:none;transition:background .3s}
.hd-cta:hover{background:#fff}
.hd-burger{display:none;background:none;border:none;padding:0;cursor:pointer;color:#F8FAFC;line-height:0}
.hd-burger .icon-x{display:none}
.hd-burger.open .icon-menu{display:none}
.hd-burger.open .icon-x{display:inline}
.hd-menu{display:none;background:rgba(6,6,6,0.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.1);padding:24px 20px;flex-direction:column;gap:20px}
.hd-menu.open{display:flex}
.hd-menu a{font-family:Oswald,sans-serif;font-size:20px;text-transform:uppercase;color:#F8FAFC;text-decoration:none}
.hd-menu a:hover{color:#F97316}
.hd-menu-cta{margin-top:8px;background:#F97316;color:#000!important;text-align:center;font-weight:600;padding:12px}
.hd-menu-cta:hover{background:#fff!important}
@media(max-width:768px){.hd-desk{display:none!important}.hd-cta-desk{display:none!important}.hd-burger{display:block}}
@media(min-width:640px){.hd-wrap{padding:0 32px;height:80px}.hd-logo{font-size:20px}}
</style>
<header class="hd-bar">
  <div class="hd-wrap">
    <a href="/" class="hd-logo">Decastro<span>.</span></a>
    <nav class="hd-desk">
      <a href="/#metodo">Metodo</a>
      <a href="/servizi.html">Servizi</a>
      <a href="/#storie">Storie</a>
      <a href="/blog/">Blog</a>
      <a href="/risorse/">Risorse</a>
      <a href="/chi-sono.html">Chi sono</a>
      <a href="/#faq">FAQ</a>
    </nav>
    <a href="/#contatti" class="hd-cta hd-cta-desk">Richiedi scheda</a>
    <button class="hd-burger" data-burger aria-label="Menu">
      <svg class="icon-menu" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
      <svg class="icon-x" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
  </div>
  <div class="hd-menu" data-mobile-menu>
    <a href="/#metodo">Metodo</a>
    <a href="/servizi.html">Servizi</a>
    <a href="/#storie">Storie</a>
    <a href="/blog/">Blog</a>
    <a href="/risorse/">Risorse</a>
    <a href="/chi-sono.html">Chi sono</a>
    <a href="/#faq">FAQ</a>
    <a href="/#contatti" class="hd-menu-cta">Richiedi scheda</a>
  </div>
</header>
<script>
(function(){var b=document.querySelector('[data-burger]');var m=document.querySelector('[data-mobile-menu]');var h=document.querySelector('.hd-bar');if(!b||!m)return;function close(){m.classList.remove('open');b.classList.remove('open');}function open(){m.classList.add('open');b.classList.add('open');}b.addEventListener('click',function(){m.classList.contains('open')?close():open();});m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close);});function s(){h.classList.toggle('scrolled',window.scrollY>40);}window.addEventListener('scroll',s,{passive:true});s();})();
</script>
